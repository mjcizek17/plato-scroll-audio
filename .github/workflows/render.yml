name: render
# Full-work production renders with Kokoro. Edit render/queue.json ({"works": [...], "dest": ...}) and push:
# one job per work, in parallel. dest "samples" commits results to the samples branch (for checking);
# dest "release" uploads MP3 + timing to the GitHub release named by "tag".
on:
  push:
    branches: [main]
    paths: ["render/queue.json"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -o pipefail -e {0}

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PIP_CPU: "--extra-index-url https://download.pytorch.org/whl/cpu"
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      works: ${{ steps.q.outputs.works }}
      dest: ${{ steps.q.outputs.dest }}
      tag: ${{ steps.q.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          echo "works=$(jq -c .works render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "dest=$(jq -r '.dest // "samples"' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // "audio-v1"' render/queue.json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        work: ${{ fromJSON(needs.plan.outputs.works) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p out && sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: (pip install -q $PIP_CPU torch && pip install -q "kokoro>=0.9.4" soundfile "misaki[en]") 2>&1 | tee -a out/log.txt
      - run: (cd engines && python kokoro_work.py ${{ matrix.work }} ../out) 2>&1 | tee -a out/log.txt
      - if: always()
        run: cp out/log.txt "out/${{ matrix.work }}.log.txt" || true
      - if: always() && needs.plan.outputs.dest == 'samples'
        run: bash tools/publish.sh out "render-${{ matrix.work }}"
      - if: success() && needs.plan.outputs.dest == 'release'
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Plato Scroll audiobooks (Horan translation), Kokoro full cast." || true
          gh release upload "$tag" out/*.mp3 out/*.timing.json out/*.report.json --clobber
