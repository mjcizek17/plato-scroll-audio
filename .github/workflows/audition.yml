name: audition
# Renders audition/passage.json with each candidate engine, masters it, and each job pushes its MP3,
# reference voices, speed report and full log to the `samples` branch as soon as it finishes.
on:
  push:
    branches: [main]
    paths: ["audition/**", "engines/kokoro_render.py", "tools/master.py", "tools/publish.sh", ".github/workflows/audition.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -o pipefail -e {0}

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PIP_CPU: "--extra-index-url https://download.pytorch.org/whl/cpu"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  kokoro:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[only:') || contains(github.event.head_commit.message, '[only:kokoro')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p out/kokoro && sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: (pip install -q $PIP_CPU torch && pip install -q "kokoro>=0.9.4" soundfile "misaki[en]") 2>&1 | tee -a out/kokoro/log.txt
      - run: (cd engines && python kokoro_render.py ../out/kokoro) 2>&1 | tee -a out/kokoro/log.txt
      - run: python tools/master.py out/kokoro/lines audition/passage.json out/kokoro/kokoro.mp3 2>&1 | tee -a out/kokoro/log.txt
      - run: |
          for f in out/kokoro/options/*.wav; do [ -e "$f" ] || continue; n=$(basename "$f" .wav)
            ffmpeg -v error -y -i "$f" -af "highpass=f=70,loudnorm=I=-19:TP=-3" -ar 44100 -b:a 128k "out/kokoro/options-$n.mp3"
            cp "out/kokoro/options/$n.txt" "out/kokoro/options-$n.txt"; done
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: kokoro, path: out/kokoro }
      - if: always()
        run: bash tools/publish.sh out/kokoro kokoro
