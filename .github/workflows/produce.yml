name: produce
# Full production: edit render/queue.json ({"works": [...], "dest": "samples"|"release", "tag": "audio-v1"}) and push.
# plan -> render shards in parallel (Kokoro + Chatterbox lines) -> assemble each work -> publish.
on:
  push:
    branches: [main]
    paths: ["render/queue.json"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -o pipefail -e {0}

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PIP_CPU: "--extra-index-url https://download.pytorch.org/whl/cpu"
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.q.outputs.shards }}
      works: ${{ steps.q.outputs.works }}
      dest: ${{ steps.q.outputs.dest }}
      tag: ${{ steps.q.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: q
        run: |
          echo "shards=$(python3 engines/script.py render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "works=$(jq -c .works render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "dest=$(jq -r '.dest // "samples"' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // "audio-v1"' render/queue.json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      W: ${{ matrix.s.work }}
      A: ${{ matrix.s.a }}
      B: ${{ matrix.s.b }}
      N: ${{ matrix.s.work }}-${{ matrix.s.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p out/lines && sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Kokoro lines
        run: |
          python -m venv /tmp/kk && /tmp/kk/bin/pip install -q $PIP_CPU torch && /tmp/kk/bin/pip install -q "kokoro>=0.9.4" soundfile "misaki[en]" 2>&1 | tail -3
          (cd engines && /tmp/kk/bin/python kokoro_lines.py $W $A $B ../out/lines) 2>&1 | tee -a out/log-$N.txt
      - name: Chatterbox lines
        run: |
          python -m venv /tmp/cb && /tmp/cb/bin/pip install -q $PIP_CPU chatterbox-tts 2>&1 | tail -3
          (cd engines && /tmp/cb/bin/python chatterbox_lines.py $W $A $B ../out/lines) 2>&1 | tee -a out/log-$N.txt
      - if: always()
        run: cp out/log-$N.txt out/lines/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "lines-${{ env.N }}", path: out/lines, retention-days: 7 }

  assemble:
    needs: [plan, render]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.plan.outputs.works) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - uses: actions/download-artifact@v4
        with: { pattern: "lines-${{ matrix.work }}-*", path: lines, merge-multiple: true }
      - run: mkdir -p out && python tools/assemble.py ${{ matrix.work }} lines out 2>&1 | tee out/assemble-${{ matrix.work }}.log.txt
      - if: always()
        run: cp lines/log-*.txt out/ 2>/dev/null || true
      - if: always() && needs.plan.outputs.dest == 'samples'
        run: bash tools/publish.sh out "produce-${{ matrix.work }}"
      - if: success() && needs.plan.outputs.dest == 'release'
        run: |
          tag="${{ needs.plan.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Plato Scroll audiobooks, Horan translation, full cast." || true
          gh release upload "$tag" out/*.mp3 out/*.timing.json out/*.report.json --clobber
