name: produce
# Full production: edit render/queue.json ({"works": [...], "dest": "samples"|"release", "tag": "audio-v1"}) and push.
# plan -> render shards in parallel (Kokoro + Chatterbox lines) -> assemble each work -> publish.
on:
  push:
    branches: [main]
    paths: ["render/queue.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read     # assemble can reuse the lines of an earlier run (queue "reuse_run")

defaults:
  run:
    shell: bash -o pipefail -e {0}

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PIP_CPU: "--extra-index-url https://download.pytorch.org/whl/cpu"
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.q.outputs.shards }}
      works: ${{ steps.q.outputs.works }}
      dest: ${{ steps.q.outputs.dest }}
      tag: ${{ steps.q.outputs.tag }}
      reuse: ${{ steps.q.outputs.reuse }}
      patch: ${{ steps.q.outputs.patch }}
      tags: ${{ steps.q.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_cast.py
      - name: Editor's notes the voices will skip (text/notes.py) and brackets to check
        run: python3 tools/lint_notes.py render/queue.json
      - name: Make missing reference clips (only when a cast entry's clip is not in cast/refs — the clips are committed)
        run: |
          if python3 -c '
          import json, os, sys
          c = json.load(open("cast/cast.json"))["characters"]
          missing = [v["ref"] for v in c.values() if v.get("ref_kokoro") and not os.path.exists(os.path.join("cast/refs", v["ref"] + ".wav"))]
          print("missing reference clips:", missing or "none"); sys.exit(1 if missing else 0)'; then exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          python3 -m venv /tmp/kk && /tmp/kk/bin/pip install -q $PIP_CPU torch && /tmp/kk/bin/pip install -q "kokoro>=0.9.4" soundfile "misaki[en]" 2>&1 | tail -2
          /tmp/kk/bin/python tools/make_refs.py
      - name: Scratch release for the reference clips and rendered lines (release files don't count against Actions storage)
        run: |
          gh release create "lines-${{ github.run_id }}" --prerelease --title "Working files, run ${{ github.run_id }}" --notes "Reference clips and rendered lines passed between the jobs; deleted when the works are published." || gh release view "lines-${{ github.run_id }}" >/dev/null
          tar -cf refs.tar -C cast/refs .
          for i in 1 2 3 4 5; do gh release upload "lines-${{ github.run_id }}" refs.tar --clobber && break; sleep $((i*20)); done
      - id: q
        run: |
          echo "shards=$(python3 engines/script.py render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "works=$(jq -c .works render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "dest=$(jq -r '.dest // "samples"' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag // "audio-v1"' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "reuse=$(jq -r '.reuse_run // ""' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "patch=$(jq -c '.patch // {}' render/queue.json)" >> "$GITHUB_OUTPUT"
          echo "tags=$(jq -c '.tags // {}' render/queue.json)" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      W: ${{ matrix.s.work }}
      A: ${{ matrix.s.a }}
      B: ${{ matrix.s.b }}
      N: ${{ matrix.s.work }}-${{ matrix.s.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: mkdir -p out/lines && sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Reference clips
        run: |
          for i in 1 2 3 4 5; do gh release download "lines-${{ github.run_id }}" -p refs.tar -D /tmp --clobber && break; sleep $((i*15)); done
          mkdir -p cast/refs && tar -xf /tmp/refs.tar -C cast/refs
      - name: Kokoro lines
        run: |
          python -m venv /tmp/kk && /tmp/kk/bin/pip install -q $PIP_CPU torch && /tmp/kk/bin/pip install -q "kokoro>=0.9.4" soundfile "misaki[en]" 2>&1 | tail -3
          (cd engines && /tmp/kk/bin/python kokoro_lines.py $W $A $B ../out/lines) 2>&1 | tee -a out/log-$N.txt
      - name: Chatterbox lines
        timeout-minutes: 320   # a stuck job still uploads the lines it finished and its log (GitHub's limit is 6 h)
        run: |
          python -m venv /tmp/cb && /tmp/cb/bin/pip install -q $PIP_CPU chatterbox-tts 2>&1 | tail -3
          (cd engines && /tmp/cb/bin/python chatterbox_lines.py $W $A $B ../out/lines) 2>&1 | tee -a out/log-$N.txt
      - if: always()
        run: cp out/log-$N.txt out/lines/ || true
      - if: always()
        name: Hand the lines to assemble
        run: |
          tar -cf "lines-${W}--${{ matrix.s.shard }}.tar" -C out/lines .
          for i in 1 2 3 4 5; do gh release upload "lines-${{ github.run_id }}" "lines-${W}--${{ matrix.s.shard }}.tar" --clobber && break; sleep $((i*20)); done

  assemble:
    needs: [plan, render]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        work: ${{ fromJSON(needs.plan.outputs.works) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - name: Collect the lines (an earlier run's first when only part of the work is re-rendered)
        run: |
          mkdir -p lines dl
          W="${{ matrix.work }}"; R="${{ needs.plan.outputs.reuse }}"
          if [ -n "$R" ]; then
            if gh release view "lines-$R" >/dev/null 2>&1; then gh release download "lines-$R" -p "lines-$W--*.tar" -D dl/old --clobber || true
            else gh run download "$R" -p "lines-$W-*" -D dl/oldart || true; fi
            for t in dl/old/*.tar; do [ -f "$t" ] && tar -xf "$t" -C lines; done
            for d in dl/oldart/*/; do [ -d "$d" ] && cp -r "$d". lines/; done
          fi
          gh release download "lines-${{ github.run_id }}" -p "lines-$W--*.tar" -D dl/new --clobber || true
          for t in dl/new/*.tar; do [ -f "$t" ] && tar -xf "$t" -C lines; done
          ls lines | wc -l
      - if: needs.plan.outputs.patch == '{}' && !endsWith(matrix.work, '_patch')
        run: mkdir -p out && python tools/assemble.py ${{ matrix.work }} lines out 2>&1 | tee out/assemble-${{ matrix.work }}.log.txt
      - if: needs.plan.outputs.patch != '{}' || endsWith(matrix.work, '_patch')
        name: Patch the published recording (only the re-recorded paragraphs or opening sentences change)
        run: |
          W="${{ matrix.work }}"; B="${W%_patch}"
          tag=$(echo '${{ needs.plan.outputs.tags }}' | jq -r --arg w "$W" --arg d "${{ needs.plan.outputs.tag }}" '.[$w] // $d')
          mkdir -p pub out
          gh release download "$tag" -p "$B-p*.mp3" -p "$B-p*.timing.json" -D pub --clobber
          if [ "$W" != "$B" ]; then
            python tools/patch.py "$W" lines pub out 2>&1 | tee out/patch-$B.log.txt
          else
            E=$(echo '${{ needs.plan.outputs.patch }}' | jq -r --arg w "$W" '.[$w] | map(tostring) | join(",")')
            python tools/patch.py "$W" lines pub out "$E" 2>&1 | tee out/patch-$W.log.txt
          fi
          ls out
      - if: always()
        run: cp lines/log-*.txt out/ 2>/dev/null || true
      - if: always() && needs.plan.outputs.dest == 'samples'
        run: bash tools/publish.sh out "produce-${{ matrix.work }}"
      - if: always() && needs.plan.outputs.dest == 'release'
        run: mkdir -p meta && cp out/*.json out/*.txt meta/ 2>/dev/null; bash tools/publish.sh meta "produce-${{ matrix.work }}"
      - if: success() && needs.plan.outputs.dest == 'release'
        run: |
          tag=$(echo '${{ needs.plan.outputs.tags }}' | jq -r --arg w "${{ matrix.work }}" --arg d "${{ needs.plan.outputs.tag }}" '.[$w] // $d')
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Plato Scroll audiobooks, Horan translation, full cast." || true
          gh release upload "$tag" out/*.mp3 out/*.timing.json $(ls out/*report.json) --clobber
          # published: this work's working files can go (a failed work keeps them for a repair run)
          for a in $(gh release view "lines-${{ github.run_id }}" --json assets -q '.assets[].name' | grep "^lines-${{ matrix.work }}--"); do gh release delete-asset "lines-${{ github.run_id }}" "$a" -y || true; done

  tidy:
    needs: assemble
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Drop the scratch release once nothing in it is needed
        run: |
          gh release delete-asset "lines-${{ github.run_id }}" refs.tar -R "${{ github.repository }}" -y 2>/dev/null || true
          n=$(gh release view "lines-${{ github.run_id }}" -R "${{ github.repository }}" --json assets -q '.assets | length' 2>/dev/null || echo x)
          [ "$n" = "0" ] && gh release delete "lines-${{ github.run_id }}" -R "${{ github.repository }}" -y --cleanup-tag || echo "kept: $n files"
